name: Windows RDP (Serveo)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Password untuk user runneradmin"
        required: false
        default: "P@ssw0rd!2026"

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "$env:RDP_PASS" /active:yes

      - name: Start Serveo TCP Tunnel
        shell: pwsh
        run: |
          $serveoLog = "C:\serveo.log"
          $serveoErr = "C:\serveo-err.log"
          $sshArgs = "-tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -R 0:localhost:3389 serveo.net"

          Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs -RedirectStandardOutput $serveoLog -RedirectStandardError $serveoErr -WindowStyle Hidden
          Start-Sleep -Seconds 7

          Write-Host "=== SERVEO TUNNEL INFO ==="
          if (Test-Path $serveoLog) { Get-Content $serveoLog }
          if (Test-Path $serveoErr) { Get-Content $serveoErr }

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000
