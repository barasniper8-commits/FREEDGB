name: Windows RDP (Pinggy)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Password untuk user runneradmin"
        required: false
        default: "P@ssw0rd!2026"

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "$env:RDP_PASS" /active:yes

      - name: Start Pinggy TCP Tunnel
        shell: pwsh
        run: |
          $pinggyDir = "C:\pinggy"
          New-Item -ItemType Directory -Path $pinggyDir -Force | Out-Null

          # Jalankan SSH ke Pinggy dengan pseudo-terminal (-tt) dan web debugger lokal di 4300
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "ssh.exe"
          $psi.Arguments = "-tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 -L4300:localhost:4300 tcp@free.pinggy.io"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true

          $proc = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 8

          Write-Host "=== PINGGY TUNNEL URL ==="
          try {
            $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4300/urls" -TimeoutSec 5
            $resp.urls | ForEach-Object { Write-Host "Alamat RDP: $_" }
          } catch {
            Write-Host "API 4300 belum merespons, membaca output mentah:"
            if (-not $proc.StandardOutput.EndOfStream) {
              Write-Host $proc.StandardOutput.ReadToEnd()
            }
          }

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000
