name: Windows RDP (Ngrok)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Password untuk user runneradmin"
        required: false
        default: "P@ssw0rd!2026"

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "$env:RDP_PASS" /active:yes

      - name: Install and Start Ngrok TCP Tunnel
        shell: pwsh
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ngrokDir = "C:\ngrok"
          New-Item -ItemType Directory -Path $ngrokDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "$ngrokDir\ngrok.zip"
          Expand-Archive -Path "$ngrokDir\ngrok.zip" -DestinationPath $ngrokDir -Force
          & "$ngrokDir\ngrok.exe" config add-authtoken "$env:NGROK_TOKEN"
          Start-Process -FilePath "$ngrokDir\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "RDP siap. Cek endpoint TCP aktif di Dashboard Ngrok (Cloud Edge -> Endpoints)."

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000
