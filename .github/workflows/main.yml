name: Build APK from Custom HTML

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyTradingApp'
      package_name:
        description: 'Package Name (cth: com.arianto.app)'
        required: true
        default: 'com.arianto.app'
      custom_html:
        description: 'Tulis / Paste Kode HTML di sini'
        required: true
        type: multiline
        default: |
          <!DOCTYPE html>
          <html lang="id">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>App</title>
          </head>
          <body>
              <h1>Halo dari GitHub Actions!</h1>
          </body>
          </html>

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova CLI
      run: |
        npm install -g cordova

    - name: Create Cordova Project & Inject HTML Safely
      run: |
        cordova create my-app com.example.app ${{ github.event.inputs.app_name }}
        cd my-app
        
        # Menggunakan base64 decode agar karakter khusus, kutip, & enter di HTML aman dari error bash
        echo "${{ github.event.inputs.custom_html }}" | base64 -d > www/index.html || echo "${{ github.event.inputs.custom_html }}" > www/index.html
        
        # Tambahkan platform Android
        cordova platform add android

    - name: Build Debug APK
      run: |
        my-app/platforms/android/gradlew -p my-app/platforms/android assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-debug
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
