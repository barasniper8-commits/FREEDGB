name: Desktop VPS with Tailscale Input & Steam

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Masukkan Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string
      tailscale_hostname:
        description: 'Nama host Tailscale (opsional)'
        required: false
        default: 'gh-desktop-vps'
        type: string
      session_minutes:
        description: 'Durasi sesi aktif dalam menit (maks 330)'
        required: false
        default: '60'
        type: string

permissions:
  contents: read

jobs:
  desktop-vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install XFCE Desktop & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp dbus-x11 wget curl ca-certificates gnupg software-properties-common
          echo "startxfce4" > ~/.xsession
          sudo systemctl enable xrdp || true
          sudo service xrdp restart || true

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable tailscaled || true
          sudo service tailscaled start || true

      - name: Connect to Tailscale from Input
        run: |
          AUTHKEY="${{ inputs.tailscale_authkey }}"
          HOSTNAME_ARG="${{ inputs.tailscale_hostname }}"

          if [ -z "$AUTHKEY" ]; then
            echo "ERROR: tailscale_authkey wajib diisi saat Run workflow."
            exit 1
          fi

          if [ -z "$HOSTNAME_ARG" ]; then
            HOSTNAME_ARG="gh-desktop-vps"
          fi

          sudo tailscale up --authkey="$AUTHKEY" --hostname="$HOSTNAME_ARG" --ssh
          tailscale status
          tailscale ip -4

      - name: Download Steam & Place Shortcut on Desktop
        run: |
          mkdir -p ~/Desktop ~/Downloads
          STEAM_DEB="$HOME/Downloads/steam_latest.deb"
          wget -q --show-progress -O "$STEAM_DEB" "https://cdn.cloudflare.steamstatic.com/client/installer/steam.deb"

          cat << 'EOF' > ~/Desktop/Steam.desktop
          [Desktop Entry]
          Version=1.0
          Name=Steam
          Comment=Application for browsing and playing games on Steam
          Exec=/usr/games/steam %U
          Icon=steam
          Terminal=false
          Type=Application
          Categories=Game;Network;
          StartupNotify=true
          EOF

          chmod +x ~/Desktop/Steam.desktop

          sudo dpkg --add-architecture i386 || true
          sudo apt-get update || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -f -y "$STEAM_DEB" || true

          ls -la ~/Desktop

      - name: Keep Session Alive
        run: |
          MINUTES="${{ inputs.session_minutes }}"
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]]; then
            MINUTES=60
          fi
          if [ "$MINUTES" -gt 330 ]; then
            MINUTES=330
          fi
          echo "VPS aktif selama $MINUTES menit. Cek IP Tailscale di log langkah 'Connect to Tailscale from Input'."
          sleep "$((MINUTES * 60))"
