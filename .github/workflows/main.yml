name: Windows RDP (Bore)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Password untuk user runneradmin"
        required: false
        default: "P@ssw0rd!2026"

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "$env:RDP_PASS" /active:yes

      - name: Install and Start Bore TCP Tunnel
        shell: pwsh
        run: |
          $boreDir = "C:\bore"
          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null

          # Ambil versi rilis terbaru dari GitHub bore (ekzhang/bore)
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*x86_64-pc-windows-msvc.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$boreDir\bore.zip"
          Expand-Archive -Path "$boreDir\bore.zip" -DestinationPath $boreDir -Force

          # Jalankan bore local 3389 --to bore.pub di background dan simpan log-nya
          Start-Process -FilePath "$boreDir\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "$boreDir\bore.log" -RedirectStandardError "$boreDir\bore-err.log" -WindowStyle Hidden
          Start-Sleep -Seconds 5

          Write-Host "=== BORE TUNNEL INFO ==="
          if (Test-Path "$boreDir\bore.log") { Get-Content "$boreDir\bore.log" }
          if (Test-Path "$boreDir\bore-err.log") { Get-Content "$boreDir\bore-err.log" }

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000
