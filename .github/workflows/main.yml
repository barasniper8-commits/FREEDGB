name: Build APK from Custom HTML

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyTradingApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.arianto.app'
      custom_html:
        description: 'Kode HTML'
        required: true
        type: multiline

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova CLI
      run: |
        npm install -g cordova

    - name: Create Project, Inject HTML & Build APK
      run: |
        cordova create my-app ${{ github.event.inputs.package_name }} ${{ github.event.inputs.app_name }}
        cd my-app

        node -e '
          const fs = require("fs");
          fs.writeFileSync("www/index.html", process.env.CUSTOM_HTML_INPUT);
        '

        cordova platform add android
        cordova build android --debug

      env:
        CUSTOM_HTML_INPUT: ${{ github.event.inputs.custom_html }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}-debug
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
