name: Windows RDP (Pinggy)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "Password untuk user runneradmin"
        required: false
        default: "P@ssw0rd!2026"

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP and Set Password
        shell: pwsh
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD || inputs.rdp_password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin "$env:RDP_PASS" /active:yes

      - name: Start Pinggy TCP Tunnel
        shell: pwsh
        run: |
          $pinggyLog = "C:\pinggy.log"
          $pinggyErr = "C:\pinggy-err.log"
          $sshArgs = "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 443 -R0:localhost:3389 tcp@free.pinggy.io"

          Start-Process -FilePath "ssh.exe" -ArgumentList $sshArgs -RedirectStandardOutput $pinggyLog -RedirectStandardError $pinggyErr -WindowStyle Hidden
          Start-Sleep -Seconds 7

          Write-Host "=== PINGGY OUTPUT ==="
          if (Test-Path $pinggyLog) { Get-Content $pinggyLog }
          if (Test-Path $pinggyErr) { Get-Content $pinggyErr }

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Start-Sleep -Seconds 21000
